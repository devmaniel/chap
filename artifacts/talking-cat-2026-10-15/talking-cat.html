  figcaption { margin-top: 8px; font-weight: 600; }

<body>
  <figure>
    <div class="cat" id="talking" role="img" aria-label="Orange cat talking and blinking"></div>
    <figcaption>Talking + blink</figcaption>
  </figure>
  <figure>
    <div class="cat" id="idle" role="img" aria-label="Orange cat quiet and blinking"></div>
    <figcaption>Quiet + blink</figcaption>
  </figure>
<script>
  // Sheet: 5 mouth columns on one fixed body; rows = eyes open, half-closed, closed.
  var CLOSED = 0, SMALL_O = 1, HALF = 2, OPEN = 3, WIDE = 4, COLS = 5;
  var EYES_OPEN = 0, EYES_HALF = 1, EYES_SHUT = 2, ROWS = 3;
  var PEAKS = [SMALL_O, OPEN, OPEN, WIDE, HALF];

  function rand(min, max) { return min + Math.random() * (max - min); }
  function pick(list) { return list[Math.floor(Math.random() * list.length)]; }

  // One sentence: words of 1-3 syllables, each syllable eases half -> peak -> half,
  // the mouth closes between words, then a longer breath at the end.
  function sentence() {
    var steps = [], words = Math.round(rand(3, 7));
    for (var w = 0; w < words; w++) {
      var syllables = Math.round(rand(1, 3));
      for (var s = 0; s < syllables; s++) {
        var peak = pick(PEAKS);
        steps.push([HALF, rand(50, 70)], [peak, rand(90, 140)]);
        if (peak !== SMALL_O) steps.push([HALF, rand(50, 70)]);
      }
      steps.push([CLOSED, rand(120, 240)]);
    }
    steps.push([CLOSED, rand(700, 1400)]);
    return steps;
  }

  // A blink: lid comes down fast, holds briefly, opens a little slower.
  function blinkSteps() {
    return [[EYES_HALF, 40], [EYES_SHUT, rand(60, 90)], [EYES_HALF, 60], [EYES_OPEN, 0]];
  }

  function animate(el, talks) {
    var mouth = CLOSED, eyes = EYES_OPEN, queue = [];

    function render() {
      el.style.backgroundPosition = (mouth * 100 / (COLS - 1)) + '% ' + (eyes * 100 / (ROWS - 1)) + '%';
    }
    function talk() {
      if (!queue.length) queue = sentence();
      var next = queue.shift();
      mouth = next[0]; render();
      setTimeout(talk, next[1]);
    }
    function blink(steps) {
      var next = steps.shift();
      eyes = next[0]; render();
      if (steps.length) { setTimeout(function () { blink(steps); }, next[1]); return; }
      // Sometimes a quick double blink, otherwise wait 2-6s.
      var again = Math.random() < 0.2;
      setTimeout(function () { blink(blinkSteps()); }, again ? rand(120, 200) : rand(2000, 6000));
    }

    render();
    if (talks) talk();
    setTimeout(function () { blink(blinkSteps()); }, rand(800, 3000));
  }

  animate(document.getElementById('talking'), true);
  animate(document.getElementById('idle'), false);
</script>
</body>
