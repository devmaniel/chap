name: app
description: "Chaps — AI friends you can message and call"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.0

dependencies:
  elevenlabs_agents: ^0.6.1
  flutter:
    sdk: flutter
  flutter_image_compress: ^2.5.1
  flutter_secure_storage: ^11.2.0
  flutter_svg: ^2.3.0
  go_router: ^17.5.0
  http: ^1.6.0
  http_parser: ^4.1.2
  permission_handler: ^12.0.1
  photo_manager: ^3.12.0
  provider: ^6.1.5+1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.7
  fake_async: ^1.3.3

flutter:
  uses-material-design: true
  assets:
    - assets/images/splash.png
    - assets/images/otter_peek.png
    - assets/images/portrait_mina.png
    - assets/images/portrait_bo.png
    - assets/images/portrait_pip.png
    - assets/images/portrait_vera.png
    - assets/images/portrait_momo.png
    - assets/images/portrait_ziggy.png
    - assets/images/wordmark.png
    - assets/images/call_cat.png
    - assets/icons/
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-600.ttf
          weight: 600
        - asset: assets/fonts/Nunito-700.ttf
          weight: 700
        - asset: assets/fonts/Nunito-800.ttf
          weight: 800
        - asset: assets/fonts/Nunito-900.ttf
          weight: 900

# dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: assets/images/app_icon.png
  android: true
  ios: true
  remove_alpha_ios: true

# dart run flutter_native_splash:create
flutter_native_splash:
  color: "#1cb4f8"
  background_image: assets/images/splash.png
  android_12:
    image: assets/images/app_icon.png
    color: "#1cb4f8"
