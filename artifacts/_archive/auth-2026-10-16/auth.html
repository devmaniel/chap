  How to extend:
  - New section: add <section data-name="..."> inside <main id="sections">. Its number is its order (0, 1, 2…).

  - New screen: add <template data-title="..." data-note="..."> inside a section. Its content is the
    screen body only — the device frame, status bar and home indicator are added by the script.
  - Device: data-device="web" puts the screen in a 1440 × 900 browser window; default is phone (iPhone 16e, 390 × 844 pt).
  - Flow headings: put data-group="..." on the first <template> of each flow.
  - Each state (empty, error, sheet open…) is its own <template>, in flow order.
  - Sidebar tabs, section headers, screen numbers (0.1, 0.2…) and counts are all generated.
  - Fence each section's HTML with @region / @endregion comments, and its CSS the same way.

    /* @endregion typography */
    /* @region tokens */
    :root {
      --canvas: #fff; --paper: #fff; --white: #fff;
      --ink: #3c3c3c; --muted: #6b6b6b; --line: #e5e5e5; --border: #8f8f8f; --surface: #f7f7f7;
      --primary: #1cb0f6; --primary-hover: #1aa3e5; --primary-edge: #1899d6; --primary-bright: #1cb0f6;
      --soft-primary: #ddf4ff; --primary-ink: #1a6fa0; --on-primary: #fff;
      --blue: #1a6fa0; --blue-soft: #ddf4ff; --blue-line: #84d8ff; --blue-bright: #1cb0f6;
      --sun: #ffc800; --sun-soft: #fff4cc; --sun-ink: #7a5a00;
      --peach: #ffe3d1; --danger: #b42a2a; --danger-soft: #ffdfe0; --danger-line: #ffb2b2;
      --font: "Nunito", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      --tap: 44px; --press: 4px;
    }
    /* @endregion tokens */
    /* @region base */
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--canvas); color: var(--ink); font-family: var(--font); -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale; }
    button, input, textarea, select { font: inherit; color: inherit; }
    button { cursor: pointer; border: 0; background: none; transition: background-color .15s, border-color .15s, color .15s, transform .1s ease-out, box-shadow .1s ease-out; -webkit-tap-highlight-color: transparent; }
    button:active:not(:disabled) { transform: translateY(1px); }
    button:focus-visible, input:focus-visible, textarea:focus-visible, select:focus-visible { outline: 3px solid var(--blue-bright); outline-offset: 3px; }
    button:disabled { cursor: default; opacity: .45; }
    h1, h2, h3, p { margin: 0; }
    svg { display: block; flex-shrink: 0; }
    .icon { width: 22px; height: 22px; fill: none; stroke: currentColor; stroke-width: 2.2; stroke-linecap: round; stroke-linejoin: round; }
    .icon-button { display: inline-grid; place-items: center; min-width: var(--tap); min-height: var(--tap); border-radius: 14px; }
    .icon-button:hover { background: var(--surface); }
    .eyebrow { font-size: 11px; font-weight: 800; letter-spacing: .12em; text-transform: uppercase; }
    .muted { color: var(--muted); }
    .ellipsis { min-width: 0; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
    /* chunky 3D press: the solid bottom shadow is the button's edge, pressing sinks into it */
    .primary { display: flex; align-items: center; justify-content: center; gap: 9px; width: 100%; min-height: 50px; padding: 13px 18px; border-radius: 16px; background: var(--primary); color: var(--on-primary); box-shadow: 0 var(--press) 0 var(--primary-edge); font-weight: 900; font-size: 15px; letter-spacing: .06em; text-transform: uppercase; }
    .primary:hover { background: var(--primary-hover); }
    .secondary { min-height: var(--tap); padding: 10px 16px; border: 2px solid var(--line); border-radius: 16px; background: var(--white); box-shadow: 0 var(--press) 0 var(--line); color: var(--blue); font-size: 13px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
    .secondary:hover { background: var(--surface); }
    .primary:active:not(:disabled), .secondary:active:not(:disabled), .heading-action:active:not(:disabled),
    .scene-button:active:not(:disabled), .filter:active:not(:disabled), .character-card:active:not(:disabled), .discovery-banner:active:not(:disabled) { transform: translateY(var(--press)); box-shadow: none; }
    .ai-tag { display: inline-block; padding: 3px 6px; border-radius: 6px; background: var(--sun-soft); color: var(--sun-ink); font-size: 9px; font-weight: 900; letter-spacing: .06em; vertical-align: middle; }
    .avatar { display: block; width: 56px; height: 56px; flex-shrink: 0; overflow: hidden; border-radius: 50%; background: var(--peach); }
    .avatar svg { width: 100%; height: 100%; }
    .avatar.small { width: 42px; height: 42px; }
    .avatar.large { width: 112px; height: 112px; }
    .tone-mina { background: #edcfb9; }
    .tone-kai { background: #d8d4ed; }
    .tone-sol { background: #deebff; }
    .tone-lumi { background: #ecd9d9; }
    .chips { display: flex; gap: 6px; flex-wrap: wrap; }
    .chip { max-width: 100%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding: 5px 11px; border: 2px solid var(--line); border-radius: 12px; background: var(--white); font-size: 11px; font-weight: 800; line-height: 1.3; }
    .visually-hidden { position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; border: 0; }

    #tabs { display: flex; flex-direction: column; gap: 4px; padding: 8px; }
    .nav-title, .nav a { display: flex; align-items: center; gap: 8px; min-height: 36px; padding: 0 10px; border-radius: 12px; font-size: 14px; font-weight: 800; }
    .nav-title { color: var(--muted); font-size: 11px; letter-spacing: .08em; text-transform: uppercase; }
    .nav a { color: var(--ink); text-decoration: none; transition: background-color .15s; }
    .nav a:hover { background: var(--white); }
    .nav a:focus-visible { outline: 3px solid var(--blue-bright); outline-offset: -3px; }
    .nav a[aria-current="page"] { background: var(--blue-soft); box-shadow: inset 0 0 0 2px var(--blue-line); color: var(--blue); font-weight: 900; }
    .nav-sub { display: flex; flex-direction: column; gap: 4px; margin: 0 14px; padding: 2px 10px; border-left: 2px solid var(--line); }
    .nav a .count { margin-left: auto; font-size: 12px; font-variant-numeric: tabular-nums; color: var(--muted); }
    .nav-foot { margin-top: auto; padding: 8px 16px; font-size: 11px; font-weight: 700; color: var(--muted); }
    #sections { padding: 28px 32px 64px; min-width: 0; }
    #sections > section:not(.active) { display: none; }
    .section-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 20px; }
    .section-head h2 { font-size: 22px; font-weight: 900; }
    .section-head span { font-weight: 700; color: var(--muted); }
    .screens { display: flex; flex-wrap: wrap; gap: 28px; }
    .group { flex: 0 0 100%; margin: 12px 0 -12px; padding-bottom: 8px; border-bottom: 2px solid var(--line); font-size: 14px; font-weight: 900; }
    .group:first-child { margin-top: 0; }
    figure { margin: 0; }
    .card { display: grid; gap: 10px; align-content: start; width: calc(412px * var(--thumb)); }
    .thumb { width: calc(412px * var(--thumb)); height: calc(866px * var(--thumb)); }
    .thumb > * { transform: scale(var(--thumb)); transform-origin: top left; }
    .card.web, .web .thumb { width: calc(1440px * var(--thumb-web)); }
    .web .thumb { height: calc(942px * var(--thumb-web)); }
    .web .thumb > * { transform: scale(var(--thumb-web)); }
    .card figcaption { font-size: 14px; font-weight: 900; }
    .card figcaption small { display: block; margin-top: 2px; font-size: 12px; font-weight: 700; line-height: 1.5; color: var(--muted); }
    /* phone: iPhone 16e, 390 × 844 pt */
    .device { position: relative; width: 412px; padding: 10px; border: 1px solid #626b7a; border-radius: 57px; background: #161b24; box-shadow: inset 0 0 0 3px #303846, 0 28px 60px -25px #3c3c3c33, 0 4px 8px #3c3c3c14; }
    .device::before { content: ""; position: absolute; top: 170px; left: -4px; width: 3px; height: 53px; border-radius: 3px 0 0 3px; background: #5c6059; box-shadow: 0 65px #5c6059; }
    .device::after { content: ""; position: absolute; top: 209px; right: -4px; width: 3px; height: 78px; border-radius: 0 3px 3px 0; background: #5c6059; }
    .screen { position: relative; display: flex; flex-direction: column; width: 390px; height: 844px; overflow: hidden; isolation: isolate; border-radius: 47px; background: var(--paper); }
    .notch { position: absolute; z-index: 10; left: 50%; top: 0; width: 163px; height: 30px; transform: translateX(-50%); background: #171a18; border-radius: 0 0 21px 21px; }
    .notch::after { content: ""; position: absolute; width: 9px; height: 9px; right: 30px; top: 9px; border-radius: 50%; background: radial-gradient(circle at 40% 40%, #26364f, #101519 65%); }
    .status-bar { flex-shrink: 0; height: 49px; display: flex; align-items: center; justify-content: space-between; padding: 4px 28px 0; font-size: 14px; font-weight: 800; }
    .status-icons { display: flex; align-items: center; gap: 5px; }
    .status-icons .icon { width: 16px; height: 16px; stroke-width: 2; }
    .battery { width: 23px; height: 11px; border: 1px solid currentColor; border-radius: 3px; padding: 1px; position: relative; }
    .battery::before { content: ""; display: block; height: 100%; width: 85%; border-radius: 1px; background: currentColor; }
    .battery::after { content: ""; position: absolute; right: -3px; top: 3px; height: 4px; width: 2px; background: currentColor; border-radius: 0 1px 1px 0; }
    .app { display: flex; flex-direction: column; flex: 1; min-height: 0; }
    .home-indicator { height: 24px; flex-shrink: 0; display: grid; place-items: center; }
    .home-indicator::after { content: ""; width: 126px; height: 5px; background: currentColor; border-radius: 9px; }
    /* web: browser window, 1440 × 900 viewport */
    .browser { position: relative; display: flex; flex-direction: column; width: 1440px; height: 942px; overflow: hidden; isolation: isolate; border: 1px solid #626b7a; border-radius: 14px; background: var(--paper); box-shadow: 0 28px 60px -25px #3c3c3c33, 0 4px 8px #3c3c3c14; }
    .browser-bar { flex-shrink: 0; display: flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; background: #161b24; }
    .browser-bar i { width: 12px; height: 12px; border-radius: 50%; background: #5c6059; }
    .browser-bar span { flex: 1; max-width: 480px; margin: 0 auto; padding: 5px 12px; border-radius: 8px; background: #303846; color: #c8cdd5; font-size: 12px; text-align: center; }
    /* @endregion presentation */
    /* @region auth */
    .screen:has(.auth) .home-indicator { position: relative; z-index: 1; }
    .auth { flex: 1; min-height: 0; display: flex; flex-direction: column; padding: 32px 28px 20px; }
    .auth h1 { margin-bottom: 28px; text-align: center; font-size: 28px; font-weight: 900; letter-spacing: -.5px; }
    .auth form { display: grid; gap: 12px; }
    .field { position: relative; }
    .field input { width: 100%; min-width: 0; height: 56px; padding: 0 16px; border: 2px solid var(--border); border-radius: 16px; background: var(--surface); font-size: 17px; font-weight: 700; color: var(--ink); caret-color: var(--primary); transition: border-color .15s, box-shadow .15s, background-color .15s; }
    .field input::placeholder { color: var(--muted); }
    .field input:focus-visible, .field.focused input { outline: none; border-color: var(--primary-edge); background: var(--white); box-shadow: 0 0 0 3px var(--blue-soft); }
    .field input[type="password"]:not(:placeholder-shown) { letter-spacing: .14em; }
    .field.invalid input { border-color: var(--danger); background: var(--danger-soft); }
    .field:has(.text-button) input { padding-right: 104px; }
    .text-button { min-height: var(--tap); padding: 0 10px; border-radius: 12px; color: var(--blue); font-size: 13px; font-weight: 900; letter-spacing: .06em; text-transform: uppercase; }
    .text-button:hover { background: var(--blue-soft); }
    .field .text-button { position: absolute; top: 6px; right: 6px; }
    .note { display: flex; align-items: center; gap: 6px; margin-top: -2px; font-size: 13px; font-weight: 800; line-height: 1.4; color: var(--muted); }
    .note.met { color: var(--blue); }
    .note.error { color: var(--danger); }
    .note .icon { width: 18px; height: 18px; stroke-width: 2.6; }
    .auth-submit { margin-top: 20px; }
    .auth .primary:disabled { opacity: 1; background: var(--line); color: var(--muted); box-shadow: none; transform: translateY(var(--press)); }
    .switch-auth { display: flex; align-items: center; justify-content: center; gap: 2px; margin-top: 14px; font-size: 14px; font-weight: 700; color: var(--muted); }
    .auth input:disabled { color: var(--muted); }
    /* loading keeps the button blue: aria-disabled, not disabled, so the grey disabled style never applies */
    .spinner { width: 22px; height: 22px; border: 3px solid rgb(255 255 255 / .4); border-top-color: var(--on-primary); border-radius: 50%; animation: spin .8s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
    /* terms sit bottom-left, narrow enough to clear the otter */
    .terms { margin-top: auto; max-width: 196px; font-size: 13px; font-weight: 700; line-height: 1.5; color: var(--muted); }
    .terms b { color: var(--ink); }

  <template id="device-web">
    <div class="browser" aria-label="Browser window">
      <div class="browser-bar" aria-hidden="true"><i></i><i></i><i></i><span>chap.app</span></div>
      <div class="app"></div>
    </div>
  </template>

  <script>
    'use strict';
    const sections = Array.from(document.querySelectorAll('#sections > section'));
    const tabs = document.getElementById('tabs');
    const tabLinks = [];
    let lastRole = '';
    let sub = tabs;

    /** @param {string} tag @param {string} [cls] @param {string} [text] */
    function el(tag, cls, text) {
      const node = document.createElement(tag);
      if (cls) node.className = cls;
      if (text) node.textContent = text;
      return node;
    }

    sections.forEach((section, i) => {
      const screens = Array.from(section.querySelectorAll(':scope > template'));
      const name = section.dataset.name || '';
      section.id = 's-' + i;

      const head = el('header', 'section-head');
      head.append(el('h2', '', i + ' · ' + name), el('span', '', screens.length + (screens.length === 1 ? ' screen' : ' screens')));
      const row = el('div', 'screens');
      screens.forEach((tpl, j) => {
        if (tpl.dataset.group) row.append(el('h3', 'group', tpl.dataset.group));
        const device = tpl.dataset.device === 'web' ? 'web' : 'phone';
        const frameTpl = document.getElementById('device-' + device);
        if (!(frameTpl instanceof HTMLTemplateElement)) throw new Error('Missing device template: ' + device);
        const frame = frameTpl.content.cloneNode(true);
        frame.querySelector('.app')?.append(tpl.content.cloneNode(true));
        const thumb = el('div', 'thumb');
        thumb.append(frame);
        const caption = el('figcaption', '', i + '.' + (j + 1) + ' ' + (tpl.dataset.title || ''));
        if (tpl.dataset.note) caption.append(el('small', '', tpl.dataset.note));
        const card = el('figure', 'card ' + device);
        card.append(thumb, caption);
        row.append(card);
      });
      section.replaceChildren(head, row);

      const parts = name.split(' · ');
      const role = parts.length > 1 ? parts[0] : '';
      const tab = el('a', '');
      tab.href = '#s-' + i;
      tab.append(document.createTextNode(role ? parts.slice(1).join(' · ') : name), el('span', 'count', String(screens.length)));
      if (role && role !== lastRole) {
        const group = el('div');
        sub = el('div', 'nav-sub');
        group.append(el('div', 'nav-title', role), sub);
        tabs.append(group);
      }
      lastRole = role;
      tabLinks.push(tab);
      (role ? sub : tabs).append(tab);
    });

    function show() {
      const active = document.getElementById(location.hash.slice(1)) || sections[0];
      sections.forEach((section, i) => {
        section.classList.toggle('active', section === active);
        if (section === active) tabLinks[i].setAttribute('aria-current', 'page');
        else tabLinks[i].removeAttribute('aria-current');
      });
      window.scrollTo(0, 0);
    }
    window.addEventListener('hashchange', show);
    show();
  </script>
